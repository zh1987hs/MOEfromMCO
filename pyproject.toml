[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnox-retrieval"
version = "0.1.0"
description = "Positive-driven retrieval pipeline for distant Mn-oxidizing MCO homolog candidates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Codex"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "biopython>=1.81",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
esm = ["torch>=2.0", "transformers>=4.35"]
umap = ["umap-learn>=0.5"]

[project.scripts]
mnox-retrieval = "mnox_retrieval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
